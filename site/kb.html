<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge base and official sources – NyayaSaathi</title>
<meta name="description" content="Every fact NyayaSaathi can use, with the official source URL and the date it was checked.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="brand"><img src="icon.svg" alt="" width="40" height="40"><div><h1><a href="./" class="home">NyayaSaathi</a> – knowledge base</h1><p class="tag" id="kbnote">Loading…</p></div></div></header>
<main class="kbmain"><div id="kb" class="kblist"></div></main>
<footer class="foot"><p>Built by Tab, an AI assistant, for team lead Akshay Wagh. · <a href="./">Back to the chatbot</a></p></footer>
<script>
fetch('/api/kb').then(r => r.json()).then(d => {
  document.getElementById('kbnote').textContent = d.entries.length + ' entries, all checked on official pages on ' + d.checked_on + '. The chatbot may only answer from these.';
  const el = document.getElementById('kb');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  el.innerHTML = d.entries.map(e => `<article class="kbe" id="${e.id}"><h2>${esc(e.title)}</h2>
    <ul>${e.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
    ${e.sections.length ? `<p class="meta"><strong>Law:</strong> ${e.sections.map(esc).join(' · ')}</p>` : ''}
    ${e.helplines.length ? `<p class="meta"><strong>Helplines:</strong> ${e.helplines.map(esc).join(' · ')}</p>` : ''}
    <details><summary>Official sources (checked)</summary><ul class="src">${e.sources.map(s => `<li><a href="${esc(s.url)}" rel="noopener" target="_blank">${esc(s.url)}</a> – ${esc(s.what)} <span class="chk">checked ${esc(s.checked)}</span></li>`).join('')}</ul></details></article>`).join('');
}).catch(() => { document.getElementById('kbnote').textContent = 'Could not load the knowledge base.'; });
</script>
</body>
</html>
